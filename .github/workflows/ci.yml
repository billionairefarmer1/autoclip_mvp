name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install FFmpeg and fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-studio.txt -r requirements-dev.txt
        # Legacy backend imports these at module load; the offline Studio does not.
        pip install httpx dashscope yt-dlp

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

    - name: Lint (undefined names / syntax)
      run: flake8 src/ tests/ start.py backend_server.py scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Type check
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Build
      working-directory: ./frontend
      run: npm run build
